name: nexsoft_server_shared
description: >
  Wire-contract types shared between the nexsoft_server backend and its
  nexsoft_server_website dashboard — one compiled definition instead of two
  hand-copied ones.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0

dependencies:
  collection: ^1.19.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  # The newest that run on Dart 3.12, as in nexsoft_server's own pubspec:
  # freezed 3.2.5 stops at analyzer <11, and the rest are held to match.
  build_runner: ">=2.13.1 <2.15.0"
  freezed: 3.2.5
  json_serializable: ">=6.15.2 <6.16.0"
  lints: ^6.1.0
