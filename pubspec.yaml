name: nexsoft_server_shared
description: >
  Wire-contract types shared between the nexsoft_server backend and its
  nexsoft_server_website dashboard — one compiled definition instead of two
  hand-copied ones.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0

dependencies:
  collection: ^1.19.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  # Generating needs Dart 3.13 (freezed 4); what they generate still
  # compiles on the 3.12 this package declares for its users.
  build_runner: ^2.17.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  lints: ^6.1.0
